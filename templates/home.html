<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="">
  <meta name="keywords" content="">

  <title>Jobsei</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

  <style>
    #banner-img {
      height: 360px;
      width: 100%;
      object-fit: cover;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 class="text-center mt-4 mb-4">Jobsei | Jobs & Careers</h1>

    <img src="../static/banner.jpg" alt="Welcome to Jobsei" height="320" width="" class="img-fluid" id="banner-img">

    <h2 class="text-center mt-3 mb-4">About Jobsei</h2>
    <p class="lead text-center">
      Find potential careers and jobs across the globe. Share opportunities for people. Genuine and verified offers from
      the industries. Shaping the World for everyone's happiness.
    </p>

    <h2 class="text-center mt-3 mb-4">Open Positions</h2>

    <ul class="d-flex flex-column gap-4">
      {% for job in jobs %}
      {% include 'jobs.html' %}
      {% endfor %}
    </ul>

    <button class="btn btn-primary btn-lg">Contact us</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
    crossorigin="anonymous"></script>
</body>

</html>
